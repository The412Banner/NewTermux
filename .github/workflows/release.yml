name: NewTermux Full Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        default: 'v1.6.0'

jobs:
  build-apk:
    name: Build NewTermux APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDemo

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/demo/*.apk
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-pre') }}
          generate_release_notes: true
          body: |
            ## NewTermux ${{ github.ref_name }}

            ### Installation
            Download the APK for your architecture:
            - `arm64-v8a` — most modern Android phones
            - `armeabi-v7a` — older 32-bit ARM devices
            - `x86_64` / `x86` — emulators and x86 devices
            - `universal` — works on all devices (larger file size)

            ### Try Before You Switch
            Download `newtermux-test-coexist_..._universal.apk` to try NewTermux **without** uninstalling Termux. It installs as a separate app (`com.termux.demo`), lets you explore all Settings and UI features, and runs a harmless demo shell. When ready to fully switch, uninstall it and install the main APK.

            > **Note:** The main NewTermux APKs use the `com.termux` package name for full binary compatibility. Uninstall the original Termux before installing the main build.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
